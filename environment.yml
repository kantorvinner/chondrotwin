name: chondrotwin
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.1
  - torchvision>=0.16
  - pytorch-cuda=12.1
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - pyyaml>=6.0
  - pip
  - pip:
      - einops>=0.7
      - hydra-zen>=0.12
      - hydra-core>=1.3
      - omegaconf>=2.3
      - timm>=0.9
      - monai>=1.3
      - onnx>=1.15
